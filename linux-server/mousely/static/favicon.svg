<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d0e15" />
  <rect x="25" y="20" width="50" height="60" rx="16" stroke="url(#grad)" stroke-width="5" />
  <line x1="50" y1="20" x2="50" y2="44" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="32" r="3.5" fill="#3b82f6" filter="url(#glow)" />
</svg>